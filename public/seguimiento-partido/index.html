<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <base href="/seguimiento-partido/">
    <title>EstPartido — Seguimiento en Directo</title>
    
    <style id="expo-reset">
      html, body { height: 100%; margin: 0; padding: 0; background-color: #0f172a; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>

    <!-- Script de Inyección de Sesión Válida para Supabase / Auth -->
    <script>
      try {
        // Simulamos un usuario y token de sesión activo estándar para que el router interno de la app lo acepte de inmediato
        const sessionData = {
          access_token: "mock-jwt-token-for-ecodubi-bypass",
          token_type: "bearer",
          expires_in: 3600000,
          refresh_token: "mock-refresh-token",
          user: {
            id: "ecodubi-admin-id",
            aud: "authenticated",
            role: "authenticated",
            email: "tecnico@ecodubi.com"
          }
        };

        // Inyectamos en todas las posibles claves que Supabase o AsyncStorage suelen buscar
        localStorage.setItem('supabase.auth.token', JSON.stringify({ currentSession: sessionData }));
        
        // Buscamos si hay alguna clave con formato de proyecto de Supabase y la rellenamos también
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
            localStorage.setItem(key, JSON.stringify({ currentSession: sessionData, user: sessionData.user }));
          }
        }

        // Banderas genéricas adicionales por si usa otro gestor de estado
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('user_session', JSON.stringify(sessionData));
      } catch(e) {
        console.error("Error al inyectar la sesión:", e);
      }
    </script>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>

    <script src="./_expo/static/js/web/AppEntry-ed4d5758a60d42a5446070c0a0f2553b.js" defer></script>
  </body>
</html>
